# The fincore login theme — one page, white, and nothing on it that is not needed.
#
# parent=keycloak inherits the templates, the messages and — note — the parent's `import` of
# common/keycloak, which still pulls PatternFly in. `styles` replaces only the parent's own
# stylesheet list, so login.css loads last and wins on specificity rather than by absence.
#
# Stated plainly because the first version of this comment claimed PatternFly did not load at all,
# which was wrong and would have sent the next person hunting for a regression that was never
# there. Dropping the framework outright means overriding `import` too, and that is a larger change
# than a white page is worth today.
#
# Per-tenant branding falls out of ADR 0010 for free: one realm per tenant, and loginTheme is a
# realm setting, so a second institution is a second theme directory rather than a code change.
parent=keycloak
styles=css/login.css
