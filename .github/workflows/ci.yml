name: CI

on:
  push:
    # Integration branches are built on every push, not only via PR: a merge
    # commit can break a branch even when each PR into it was green.
    branches:
      - main
      - 'feature/**'
  pull_request:

# Only the newest run for a ref is worth paying for. Pushing three times to a branch
# used to start three full builds — each spinning up PostgreSQL, resolving the whole
# Maven reactor and running every suite — and the first two were answering a question
# about code that no longer existed.
#
# main is excluded from cancellation on purpose. A run on main is the record of whether
# what is on main actually builds; cancelling it to start the next one leaves a merge
# commit whose result nobody ever learns. On a branch the newest push supersedes the
# older; on main every commit's answer is worth having.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    # Every ledger suite runs against real PostgreSQL — never an in-memory
    # substitute. The locking, trigger, constraint and RLS behaviour under
    # test *is* PostgreSQL's (services/ledger/docs/testing.md).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fincore
          POSTGRES_PASSWORD: fincore
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fincore -d ledger"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      # RLS cannot constrain a SUPERUSER or a BYPASSRLS role, and exempts a
      # table's owner unless the table is FORCEd — so every service connects as
      # a restricted role and migrations run as the owner (ADR 0007). Locally
      # these come from db/init; service containers cannot mount init scripts,
      # so CI creates them here.
      #
      # Adding a service is a one-line change to each list below. A deployable
      # holding several modules needs one role per module, each granted only on
      # its own schema (ADR 0006) — Core will add core_customer, core_product
      # and core_orchestration alongside a "core" database.
      - name: Create databases and restricted application roles
        env:
          PGPASSWORD: fincore
        run: |
          set -euo pipefail

          # Databases beyond POSTGRES_DB, which already created "ledger".
          DATABASES="core notification"

          # Restricted roles. One per service, and one per module where a deployable holds
          # several (ADR 0006) — a cross-module query then fails at runtime rather than
          # surviving until someone tries to extract a module. The password matches the role
          # name in CI only; deployments provision real secrets.
          ROLES="ledger_app core_customer core_product core_organization core_orchestration core_relay core_worker \
                 notification_app notification_worker"

          for db in $DATABASES; do
            echo "creating database $db"
            psql -h localhost -U fincore -d ledger -v ON_ERROR_STOP=1 \
              -c "CREATE DATABASE \"$db\";"
          done

          for role in $ROLES; do
            echo "creating restricted role $role"
            psql -h localhost -U fincore -d ledger -v ON_ERROR_STOP=1 \
              -c "CREATE ROLE \"$role\" LOGIN PASSWORD '$role' \
                  NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;"
          done

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Every deployable owns its own database (AGENTS.md rule 5), so each one is
      # tested against its own. A single job-wide SPRING_DATASOURCE_URL cannot
      # express that: both deployables read the same variable with different
      # defaults, so whichever value CI set, the other connected to the wrong
      # database. Core did — it resolved the ledger's URL and tried to CREATE
      # SCHEMA there as ledger_app. Locally the variable is unset, both fall back
      # to their own defaults, and the collision is invisible. The env belongs to
      # the deployable, not to the job.
      - name: Build everything once
        run: ./mvnw --batch-mode install -DskipTests

      # Traffic as the restricted role, migrations as the owner — the same
      # separation the service uses in compose and in production.
      - name: Test — libs and the ledger deployable
        run: ./mvnw --batch-mode verify -pl libs/auth,libs/events,services/ledger
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ledger
          SPRING_DATASOURCE_USERNAME: ledger_app
          SPRING_DATASOURCE_PASSWORD: ledger_app
          SPRING_FLYWAY_USER: fincore
          SPRING_FLYWAY_PASSWORD: fincore

      # Core connects per module role (ADR 0006); the URL is the only thing shared,
      # and it is Core's database, never the ledger's.
      - name: Test — the Core deployable
        run: ./mvnw --batch-mode verify -pl services/core/customer,services/core/product,services/core/organization,services/core/orchestration,services/core/app
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/core
          SPRING_DATASOURCE_USERNAME: fincore
          SPRING_DATASOURCE_PASSWORD: fincore
          SPRING_FLYWAY_USER: fincore
          SPRING_FLYWAY_PASSWORD: fincore

      # Notification is a deployable like the others and was not tested here at all: the module
      # built during "Build everything once" and then nothing ran it, so its 50 tests were green
      # only on a developer's machine. A module absent from this list is a module CI does not
      # check, and nothing says so — which is why the list is the thing to update when one is added.
      - name: Test — the Notification deployable
        run: ./mvnw --batch-mode verify -pl services/notification
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/notification
          SPRING_DATASOURCE_USERNAME: fincore
          SPRING_DATASOURCE_PASSWORD: fincore
          SPRING_FLYWAY_USER: fincore
          SPRING_FLYWAY_PASSWORD: fincore

  # An AGREED design is a contract. If a PR edits one without recording the
  # amendment, the convention in docs/conventions/design-changes.md is being
  # skipped — so the build says so, rather than a reviewer having to notice.
  # Runs on pushes as well as pull requests, and the two halves below differ in
  # what they can check. The amendment half needs a base to diff against and is
  # skipped on a push; the version half needs nothing but the tree, and skipping
  # it was how Core reached a [1.11.0] entry with every header still saying
  # v1.10 — caught by hand during a merge rather than by the guardrail that
  # exists to catch it. A check that only runs on the path code usually takes is
  # a check with a hole in it.
  design-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Amended design docs require a CHANGELOG entry
        run: |
          set -euo pipefail
          status=0

          # Only a pull request has a base to diff against. On a push this half is
          # skipped and the version check below still runs.
          changed=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            changed="$(git diff --name-only "$base"...HEAD)"
          fi

          services="$(printf '%s\n' "$changed" \
            | awk -F/ '/^services\/[^/]+\/docs\/.*\.md$/ { print $2 }' | sort -u)"

          for svc in $services; do
            design="services/$svc/docs/design.md"

            # Only AGREED designs are under amendment control; DRAFT ones move freely.
            grep -qs '^\*\*Status:\*\* AGREED' "$design" || continue

            # Did anything other than the changelog itself change?
            contract_changed="$(printf '%s\n' "$changed" \
              | grep "^services/$svc/docs/" | grep -v '/CHANGELOG\.md$' || true)"
            [ -n "$contract_changed" ] || continue

            if ! printf '%s\n' "$changed" | grep -qx "services/$svc/docs/CHANGELOG.md"; then
              echo "::error::'$svc' has an AGREED design and this PR changes it, but"
              echo "::error::services/$svc/docs/CHANGELOG.md was not updated."
              echo "::error::See docs/conventions/design-changes.md — every amendment needs an"
              echo "::error::entry and a version bump in the status headers."
              printf '  changed: %s\n' $contract_changed
              status=1
            fi
          done

          # The version in the newest CHANGELOG entry must equal the version in every
          # status header for that service.
          #
          # This is checked for every service on every PR, not only the ones a PR touches,
          # because the drift it catches is created by the PR that forgot the bump and only
          # noticed by everyone after. Both the ledger and Core reached a [1.7.0] entry while
          # every header still said v1.6, and CI was green throughout — the job asked for the
          # bump in an error message and never verified it. A guardrail that states a rule it
          # does not check is worse than none: it reads as coverage.
          for design in services/*/docs/design.md; do
            svc="$(printf '%s' "$design" | awk -F/ '{ print $2 }')"
            changelog="services/$svc/docs/CHANGELOG.md"

            grep -qs '^\*\*Status:\*\* AGREED' "$design" || continue
            [ -f "$changelog" ] || continue

            # Newest entry, e.g. "## [1.7.0] — ..." -> 1.7.0, and its MAJOR.MINOR.
            newest="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' "$changelog" \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
            if [ -z "$newest" ]; then
              echo "::error::$changelog has no version entry of the form '## [X.Y.Z]'."
              status=1
              continue
            fi
            short="${newest%.*}"

            for doc in services/$svc/docs/*.md; do
              case "$doc" in */CHANGELOG.md) continue ;; esac

              # The status header is a header: only the first few lines count, so a version
              # mentioned in prose further down cannot satisfy this.
              have="$(head -n 6 "$doc" | grep -oE 'AGREED v[0-9]+(\.[0-9]+)+' \
                | head -n1 | sed 's/^AGREED v//' || true)"
              if [ -z "$have" ]; then
                echo "::error::$doc carries no 'AGREED vX.Y' status header."
                status=1
                continue
              fi
              if [ "$have" != "$short" ] && [ "$have" != "$newest" ]; then
                echo "::error::$doc says AGREED v$have but $changelog's newest entry is $newest."
                echo "::error::Every design doc in a service carries the same version —"
                echo "::error::see docs/conventions/design-changes.md, 'One contract, one version'."
                status=1
              fi
            done

            # AGENTS.md is the entry point an agent reads first, and it names each service's
            # agreed version. It has gone stale twice — once claiming Core had "no code written
            # yet" while Core was implemented, merged and running with 191 tests. An agent
            # following it would have rebuilt a finished service. Prose that lies about state is
            # worse than absent prose, so the version it states is checked like any other.
            stated="$(grep -oE '`services/'"$svc"'`.*AGREED v[0-9]+(\.[0-9]+)+' AGENTS.md \
              | grep -oE 'AGREED v[0-9]+(\.[0-9]+)+' | head -n1 | sed 's/^AGREED v//' || true)"
            if [ -n "$stated" ] && [ "$stated" != "$short" ] && [ "$stated" != "$newest" ]; then
              echo "::error::AGENTS.md says services/$svc is AGREED v$stated, but its newest"
              echo "::error::CHANGELOG entry is $newest. Update the 'Current state' section."
              status=1
            fi
          done

          exit $status
