# Local development stack.
#
#   docker compose up --build      # database + ledger, both containerised
#   docker compose up -d postgres  # database only, for running the app from an IDE
#
# Spring Boot's docker-compose support starts the `postgres` service
# automatically when the app runs on a dev machine rather than in a container,
# which is why the database is also useful on its own.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fincore
      POSTGRES_PASSWORD: fincore
      POSTGRES_DB: ledger
    ports:
      # Deliberately not 5432. Nearly every developer machine already has
      # something on the default port, and a clash here fails the whole stack
      # for a reason that has nothing to do with fincore. The host port only
      # matters when running the app from an IDE — the ledger container reaches
      # the database over the compose network as `postgres:5432` either way.
      #   FINCORE_POSTGRES_PORT=5432 docker compose up   # if you want the usual one
      - "${FINCORE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the non-superuser runtime role. RLS cannot constrain a superuser,
      # so the service must not connect as one.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `pg_isready` on its own reports true during init, while the server is
      # briefly up on a temporary socket. Naming the user and database makes the
      # check mean "ready for *this* application".
      test: ["CMD-SHELL", "pg_isready -U fincore -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Event backbone (ADR 0005). KRaft mode, so no ZooKeeper: one container.
  # Single broker with replication factor 1 — a development topology, not a
  # production one.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: fincore-dev-cluster-0001
    ports:
      # 29092 for tools on the host; the ledger reaches it as kafka:9092.
      - "${FINCORE_KAFKA_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Alternative backbone. Opt-in, so `docker compose up` stays lean:
  #   docker compose --profile rabbit up
  # then set ledger.events.broker=rabbit.
  rabbitmq:
    image: rabbitmq:4-management
    profiles: ["rabbit"]
    environment:
      RABBITMQ_DEFAULT_USER: fincore
      RABBITMQ_DEFAULT_PASS: fincore
    ports:
      - "${FINCORE_RABBIT_PORT:-5672}:5672"
      - "${FINCORE_RABBIT_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Identity provider (ADR 0010). Opt-in, because nothing consumes it yet:
  #   docker compose --profile identity up -d keycloak
  # then point a service at fincore.auth.issuer-uri.
  #
  # Development mode only — no persistence, throwaway credentials, HTTP. Real
  # deployments configure this properly and those details live with the
  # deployment, not in this repository (AGENTS.md hard rule 8).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["identity"]
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${FINCORE_KEYCLOAK_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  ledger:
    build:
      # Root context: the Dockerfile builds through the Maven reactor, so it
      # needs the parent pom and the wrapper.
      context: .
      dockerfile: services/ledger/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # The service connects as the restricted role; Flyway migrates as the
      # owner. Separation of duties: DDL and traffic are different jobs.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger
      SPRING_DATASOURCE_USERNAME: ledger_app
      SPRING_DATASOURCE_PASSWORD: ledger_app
      SPRING_FLYWAY_USER: fincore
      SPRING_FLYWAY_PASSWORD: fincore
      # A container is not a dev machine; it must never start its own database
      # sidecar.
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      # Which backbone the relay publishes to: kafka | rabbit | log.
      # 'log' is the development adapter and delivers nothing; the startup
      # summary says so plainly rather than letting it pass for delivery.
      LEDGER_EVENTS_BROKER: ${FINCORE_EVENTS_BROKER:-kafka}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: fincore
      SPRING_RABBITMQ_PASSWORD: fincore
      # Without confirms, a discarded message still reports success and the relay
      # marks it published. Correlated confirms make acknowledgement mean delivery.
      SPRING_RABBITMQ_PUBLISHER_CONFIRM_TYPE: correlated
      SPRING_RABBITMQ_PUBLISHER_RETURNS: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Core — the deployable that orchestrates transfers. Four modules, one process,
  # one image; the boundary between them is enforced by per-module database roles
  # inside the container, not by separate containers (ADR 0006).
  core:
    build:
      # Root context: the Dockerfile builds through the Maven reactor, so it
      # needs the parent pom, the wrapper and libs/auth.
      context: .
      dockerfile: services/core/app/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      # Core calls the ledger to move money and is useless without it. Waiting for
      # readiness rather than start means the first transfer does not race the
      # ledger's migrations.
      ledger:
        condition: service_healthy
    environment:
      # Core's own database — never the ledger's. A deployable owns its database
      # (AGENTS.md rule 5), and the roles come from db/init/30-core-roles.sql.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/core
      SPRING_DATASOURCE_USERNAME: fincore
      SPRING_DATASOURCE_PASSWORD: fincore
      # A container is not a dev machine; it must never start its own database
      # sidecar.
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      # Orchestration's only outbound dependency, by service name on the compose
      # network. No other module may hold a ledger client.
      FINCORE_LEDGER_URL: http://ledger:8080
      # Dev identity: headers rather than tokens. libs/auth refuses this unless a
      # sanctioned profile is also active, so the profile is set here too and the
      # startup banner says loudly that this is not authentication (ADR 0010).
      # Run `docker compose --profile identity up` and set FINCORE_AUTH_MODE=jwt
      # with an issuer URI to exercise the real path against Keycloak.
      FINCORE_AUTH_MODE: ${FINCORE_AUTH_MODE:-dev}
      FINCORE_AUTH_ISSUER_URI: ${FINCORE_AUTH_ISSUER_URI:-}
      SPRING_PROFILES_ACTIVE: ${FINCORE_CORE_PROFILE:-dev}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
