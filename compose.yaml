# Local development stack.
#
#   docker compose up --build      # database + ledger, both containerised
#   docker compose up -d postgres  # database only, for running the app from an IDE
#
# Spring Boot's docker-compose support starts the `postgres` service
# automatically when the app runs on a dev machine rather than in a container,
# which is why the database is also useful on its own.
services:
  postgres:
    image: postgres:16
    # Local convenience only, and deliberately not how this is solved in production. Each service
    # opens one pool per module — Core alone has six — and the default 100 is exhausted by a
    # running stack plus a few Spring test contexts, so `docker compose up` and `./mvnw verify`
    # could not coexist. Raising the ceiling fixes that on a laptop.
    #
    # In production the ceiling is the wrong lever: a PostgreSQL connection is a backend process,
    # throughput peaks at a couple of dozen active connections, and more of them makes it worse
    # rather than better. The answer there is small right-sized pools behind a transaction-mode
    # pooler — which this platform can use precisely because tenant context is SET LOCAL and no
    # transaction is held across an outbound call.
    command: ["postgres", "-c", "max_connections=400"]
    environment:
      POSTGRES_USER: fincore
      POSTGRES_PASSWORD: fincore
      POSTGRES_DB: ledger
    ports:
      # Deliberately not 5432. Nearly every developer machine already has
      # something on the default port, and a clash here fails the whole stack
      # for a reason that has nothing to do with fincore. The host port only
      # matters when running the app from an IDE — the ledger container reaches
      # the database over the compose network as `postgres:5432` either way.
      #   FINCORE_POSTGRES_PORT=5432 docker compose up   # if you want the usual one
      - "${FINCORE_POSTGRES_PORT:-55432}:5432"
    volumes:
      # NOTE: the 2026-08-11 migration squash (the reset to V1 baselines) has no
      # in-place upgrade path. A pgdata volume created before it fails Flyway
      # validation at startup — `docker compose down -v` and rebuild. See README
      # "Running it".
      - pgdata:/var/lib/postgresql/data
      # Creates the non-superuser runtime role. RLS cannot constrain a superuser,
      # so the service must not connect as one.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `pg_isready` on its own reports true during init, while the server is
      # briefly up on a temporary socket. Naming the user and database makes the
      # check mean "ready for *this* application".
      test: ["CMD-SHELL", "pg_isready -U fincore -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Event backbone (ADR 0005). KRaft mode, so no ZooKeeper: one container.
  # Single broker with replication factor 1 — a development topology, not a
  # production one.
  # ── Event backbone: pick exactly one ────────────────────────────────────────────────────────
  # The backbone is a runtime choice, not a code dependency (ADR 0005): libs/events selects an
  # adapter from FINCORE_EVENTS_BROKER, and both Kafka and RabbitMQ are first-class, supported
  # options — this is open source and an operator is free to run either. What this file will NOT do
  # is provision both at once: each broker sits behind its own compose profile, so exactly the one
  # you choose starts, and the services depend on neither by name.
  #
  #   Kafka  (default): docker compose up                              # .env sets COMPOSE_PROFILES=kafka
  #   Rabbit          : COMPOSE_PROFILES=rabbit FINCORE_EVENTS_BROKER=rabbit docker compose up
  #
  # Kafka is the *recommended* default (ADR 0005): a durable log, so Compliance and Reporting can
  # replay history. RabbitMQ is fully supported for operators whose consumers only react to now.
  kafka:
    image: apache/kafka:3.9.0
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: fincore-dev-cluster-0001
    ports:
      # 29092 for tools on the host; the ledger reaches it as kafka:9092.
      - "${FINCORE_KAFKA_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # The other supported backbone. Behind the `rabbit` profile, so it starts only when chosen and
  # never alongside Kafka. Choose it with:
  #   COMPOSE_PROFILES=rabbit FINCORE_EVENTS_BROKER=rabbit docker compose up
  rabbitmq:
    image: rabbitmq:4-management
    profiles: ["rabbit"]
    environment:
      RABBITMQ_DEFAULT_USER: fincore
      RABBITMQ_DEFAULT_PASS: fincore
    ports:
      - "${FINCORE_RABBIT_PORT:-5672}:5672"
      - "${FINCORE_RABBIT_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Identity provider (ADR 0018): first-party, client-driven, minting the token every other
  # service already verifies. Replaces Keycloak — the realm-per-tenant model, the realm template,
  # render-realms.sh and the keycloak/ tree are retired with this service (the removed files sit
  # in _to_delete/ until the branch is reviewed).
  #
  # Part of the default stack, so `docker compose up` spins up the whole platform — identity
  # included — in one command. It replaces Keycloak, which was opt-in only because nothing consumed
  # it; identity is consumed by everything, so it comes up with everything.
  #
  # `docker compose up` runs core and notification on REAL tokens (FINCORE_AUTH_MODE defaults
  # to jwt below) verified against this service — the portal's login path end to end. The ledger
  # stays in header mode by default because Core's service token (FINCORE_CORE_LEDGER_SERVICE_TOKEN)
  # is deployment-supplied; flip it too with FINCORE_LEDGER_AUTH_MODE=jwt once that token is minted.
  # To fall back to header-trusting dev mode: FINCORE_AUTH_MODE=dev docker compose up.
  #
  # One deployed instance serves one institution (ADR 0018). The manifest (bootstrap/tenants.json)
  # is seeded by this service's own seeder at startup — no realm rendering, no separate registry
  # script. NOTE: the ledger/core/notification registries still seed their own dev tenant; for a
  # real-token run, that tenant must match the manifest (run bootstrap/seed-registries.sh, or align
  # the dev tenant UUID) until those services grow their ADR 0016 manifest seeders.
  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Owner runs Flyway; traffic connects as identity_app (service-scaffold §4).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity
      SPRING_DATASOURCE_USERNAME: fincore
      SPRING_DATASOURCE_PASSWORD: fincore
      FINCORE_IDENTITY_DB_USER: identity_app
      FINCORE_IDENTITY_DB_PASSWORD: identity_app

      # The public fact baked into every token — a stable string verifiers match exactly. The
      # other services set FINCORE_AUTH_ISSUER_URI to this value and FINCORE_AUTH_JWKS_URI to the
      # in-network JWKS (http://identity:8083/.well-known/jwks.json), because the issuer is a
      # public fact while where keys are fetched is a network detail only the compose net resolves.
      FINCORE_IDENTITY_ISSUER: http://localhost:58183

      # Core is the directory's only trusted caller (admin-surface §5): it mints a
      # client-credentials token with this secret and forwards the administrator's own token
      # beside it. A dev secret like the throwaway database passwords above — a deployment
      # supplies a real one by reference (hard rule 8).
      FINCORE_IDENTITY_SERVICE_CLIENTS: core=FINCORE_CORE_IDENTITY_SECRET,notification=FINCORE_NOTIFICATION_IDENTITY_SECRET,product=FINCORE_PRODUCT_IDENTITY_SECRET
      FINCORE_CORE_IDENTITY_SECRET: ${FINCORE_CORE_IDENTITY_SECRET:-dev-core-directory-secret}
      FINCORE_NOTIFICATION_IDENTITY_SECRET: ${FINCORE_NOTIFICATION_IDENTITY_SECRET:-dev-notification-reader-secret}
      FINCORE_PRODUCT_IDENTITY_SECRET: ${FINCORE_PRODUCT_IDENTITY_SECRET:-dev-product-ledger-reader-secret}

      # What Notification may do inside a tenant (ADR 0019), and nothing more: the two reads it
      # needs to address a message. Declared here rather than asked for on the call, so widening a
      # service's reach is a deployment change somebody reviews. `core` is deliberately absent —
      # it holds the tenantless token the ledger's caller allowlist expects and needs no grants.
      # ADR 0020 moved Product and Customer out of Core, so Core is now a *client* of both and
      # needs tenant-scoped grants it never needed while they were in-process. Exactly the calls
      # the money path and account opening make, and nothing wider: widening a service's reach
      # stays a deployment change somebody reviews.
      FINCORE_IDENTITY_SERVICE_CLIENT_GRANTS: notification=customers:contact|transfers:read,core=products:read|products:create|customers:read|customers:create|customers:link

      # The manifest, mounted read-only. Seeded idempotently on every boot (ADR 0016 / 0018).
      FINCORE_IDENTITY_MANIFEST: /bootstrap/tenants.json
      # One deployed instance = one institution (ADR 0018). The manifest carries one entry and
      # this names it explicitly, so a second entry added by mistake fails loudly at startup
      # instead of leaving Tenants.instanceTenant to refuse the ambiguity at first login.
      FINCORE_IDENTITY_TENANT_ID: ${FINCORE_IDENTITY_TENANT_ID:-8f1c0a52-3d47-4e19-9b6a-2c7f4a10d8e3}
      # The one super-administrator's temporary credential is written here, once, mode 600. This
      # bind-mounts back to the repo's bootstrap/ so a developer can read it after first boot; it
      # is gitignored. Never committed (AGENTS.md hard rule 8).
      FINCORE_IDENTITY_CREDENTIALS_OUT: /bootstrap/.seeded-credentials.txt

      # No signing key configured => an ephemeral dev key, and the startup banner says so loudly.
      # A deployment supplies fincore.identity.signing.private-key-pem by reference and tokens
      # then survive a restart. Never run a deployment on the ephemeral key.
      SPRING_PROFILES_ACTIVE: ${FINCORE_IDENTITY_PROFILE:-dev}
    volumes:
      - ./bootstrap:/bootstrap
    ports:
      # 58183 on the host for the same reason every other service avoids its own test port: the
      # service binds 8083 in its own suite. 8183 is the in-container port a browser reaches.
      - "${FINCORE_IDENTITY_PORT:-58183}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # The edge (ADR 0014): one origin for client apps, TLS termination in deployments, path
  # routing, bearer passed through untouched. Deliberately no route to the ledger.
  edge:
    image: nginx:1.27-alpine
    profiles: ["edge"]
    depends_on:
      core:
        condition: service_healthy
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./edge/html:/usr/share/nginx/html:ro
    ports:
      - "${FINCORE_EDGE_PORT:-8088}:80"

  ledger:
    build:
      # Root context: the Dockerfile builds through the Maven reactor, so it
      # needs the parent pom and the wrapper.
      context: .
      dockerfile: services/ledger/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      # No hard dependency on a broker by name — the backbone is a choice (kafka | rabbit), and
      # naming one here would drag it up even when the other was chosen. The relay is broker-
      # agnostic and reconnects; the outbox holds events until the chosen broker is reachable, so
      # nothing is lost by starting first.
    environment:
      # The service connects as the restricted role; Flyway migrates as the
      # owner. Separation of duties: DDL and traffic are different jobs.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger
      SPRING_DATASOURCE_USERNAME: ledger_app
      SPRING_DATASOURCE_PASSWORD: ledger_app
      SPRING_FLYWAY_USER: fincore
      SPRING_FLYWAY_PASSWORD: fincore
      # A container is not a dev machine; it must never start its own database
      # sidecar.
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      # Which backbone the relay publishes to: kafka | rabbit | log.
      # 'log' is the development adapter and delivers nothing; the startup
      # summary says so plainly rather than letting it pass for delivery.
      FINCORE_EVENTS_BROKER: ${FINCORE_EVENTS_BROKER:-kafka}
      # Seeds the development tenant at startup, loudly. Local stacks only —
      # a deployment must never set this (tenant/DevTenantSeeder).
      # Ledger identity (ADR 0014): header mode is the dev stand-in, double-locked to a
      # sanctioned profile exactly like libs/auth's dev mode. Set FINCORE_LEDGER_AUTH_MODE=jwt
      # (with the issuer/JWKS pair below) to verify service credentials for real.
      FINCORE_LEDGER_AUTH_MODE: ${FINCORE_LEDGER_AUTH_MODE:-header}
      # Default to the identity service, so flipping FINCORE_LEDGER_AUTH_MODE=jwt needs no other
      # config. Issuer is the public string identity mints; JWKS is fetched in-network.
      FINCORE_LEDGER_AUTH_ISSUER_URI: ${FINCORE_AUTH_ISSUER_URI:-http://localhost:58183}
      FINCORE_LEDGER_AUTH_JWKS_URI: ${FINCORE_AUTH_JWKS_URI:-http://identity:8083/.well-known/jwks.json}
      SPRING_PROFILES_ACTIVE: ${FINCORE_LEDGER_PROFILE:-dev}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Present so the rabbit backbone works the moment it is chosen; ignored under the kafka
      # broker. Only the selected adapter connects (ADR 0005), so carrying both sets of settings
      # costs nothing and means switching backbone is one variable, not a config edit.
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: fincore
      SPRING_RABBITMQ_PASSWORD: fincore
      # Without confirms, a discarded message still reports success and the relay
      # marks it published. Correlated confirms make acknowledgement mean delivery.
      SPRING_RABBITMQ_PUBLISHER_CONFIRM_TYPE: correlated
      SPRING_RABBITMQ_PUBLISHER_RETURNS: "true"
    ports:
      # Published on 58080, not 8080 — the same reasoning as the database's 55432. The service's
      # own test suite starts a server on 8080, so a container holding that port meant
      # `docker compose up` and `./mvnw verify` could not run at the same time. A stack should
      # never be able to break the build, or the other way round.
      #
      # Only the host side moves. Inside the compose network this is still 8080, which is why
      # Core's FINCORE_LEDGER_URL and the healthcheck below are unchanged.
      - "${FINCORE_LEDGER_PORT:-58080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Core — the deployable that orchestrates transfers. Four modules, one process,
  # one image; the boundary between them is enforced by per-module database roles
  # inside the container, not by separate containers (ADR 0006).
  # ---------------------------------------------------------------------------
  # Product — the catalogue and its pricing (ADR 0020).
  #
  # Extracted from Core because a published version and its rules are immutable by database
  # trigger, which is what makes a pricing decision safe to answer across a network. It answers
  # questions and returns decisions; it never posts money. Its only outbound call is a read to the
  # ledger, on the authoring path, to refuse a fee rule naming an account that does not exist.
  # ---------------------------------------------------------------------------
  product:
    build:
      context: .
      dockerfile: services/product/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      # It mints its own tenant-scoped credential before it can read the ledger (ADR 0019).
      identity:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product
      SPRING_DATASOURCE_USERNAME: fincore
      SPRING_DATASOURCE_PASSWORD: fincore
      FINCORE_PRODUCT_DB_USER: product_app
      FINCORE_PRODUCT_DB_PASSWORD: product_app

      FINCORE_AUTH_MODE: jwt
      FINCORE_AUTH_ISSUER_URI: ${FINCORE_AUTH_ISSUER_URI:-http://localhost:58183}
      FINCORE_AUTH_JWKS_URI: ${FINCORE_AUTH_JWKS_URI:-http://identity:8083/.well-known/jwks.json}

      FINCORE_PRODUCT_LEDGER_URL: http://ledger:8080
      FINCORE_PRODUCT_IDENTITY_BASE_URL: http://identity:8083
      FINCORE_PRODUCT_IDENTITY_CLIENT_ID: product
      FINCORE_PRODUCT_IDENTITY_CLIENT_SECRET: ${FINCORE_PRODUCT_IDENTITY_SECRET:-dev-product-ledger-reader-secret}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Customer — people, their tiers, their contact details and the accounts they hold (ADR 0020).
  #
  # The only service holding PII, and the one other services will consume: lending, partner APIs,
  # any customer-owned surface. That is the whole argument for it standing alone rather than being
  # reached by calling the service that moves money. It posts nothing and holds no ledger client.
  # ---------------------------------------------------------------------------
  customer:
    build:
      context: .
      dockerfile: services/customer/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer
      SPRING_DATASOURCE_USERNAME: fincore
      SPRING_DATASOURCE_PASSWORD: fincore
      FINCORE_CUSTOMER_DB_USER: customer_app
      FINCORE_CUSTOMER_DB_PASSWORD: customer_app

      FINCORE_AUTH_MODE: jwt
      FINCORE_AUTH_ISSUER_URI: ${FINCORE_AUTH_ISSUER_URI:-http://localhost:58183}
      FINCORE_AUTH_JWKS_URI: ${FINCORE_AUTH_JWKS_URI:-http://identity:8083/.well-known/jwks.json}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  core:
    build:
      # Root context: the Dockerfile builds through the Maven reactor, so it
      # needs the parent pom, the wrapper and libs/auth.
      context: .
      dockerfile: services/core/app/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      # Core calls the ledger to move money and is useless without it. Waiting for
      # readiness rather than start means the first transfer does not race the
      # ledger's migrations.
      ledger:
        condition: service_healthy
      identity:
        condition: service_healthy
    environment:
      # Core's own database — never the ledger's. A deployable owns its database
      # (AGENTS.md rule 5), and the roles come from db/init/30-core-roles.sql.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/core
      SPRING_DATASOURCE_USERNAME: fincore
      SPRING_DATASOURCE_PASSWORD: fincore
      # A container is not a dev machine; it must never start its own database
      # sidecar.
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      # Orchestration's only outbound dependency, by service name on the compose
      # network. No other module may hold a ledger client.
      FINCORE_LEDGER_URL: http://ledger:8080
      # Core is a client of both since ADR 0020. Fails closed: an unreachable pricing service
      # refuses a transaction rather than pricing it at nothing.
      FINCORE_CORE_PRODUCT_BASE_URL: http://product:8084
      FINCORE_CORE_CUSTOMER_BASE_URL: http://customer:8085
      # Seeds the development tenant at startup, loudly. Local stacks only.
      # The same backbone key both services read (libs/events). One key, so an
      # operator cannot half-migrate by changing it in one place.
      FINCORE_EVENTS_BROKER: ${FINCORE_EVENTS_BROKER:-kafka}
      FINCORE_EVENTS_TOPIC_PREFIX: fincore.core
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Dev identity: headers rather than tokens. libs/auth refuses this unless a
      # sanctioned profile is also active, so the profile is set here too and the
      # startup banner says loudly that this is not authentication (ADR 0010).
      # Real tokens by default; FINCORE_AUTH_MODE=dev falls back to the header-trusting dev
      # resolver. The issuer/JWKS defaults below already
      # point at the identity service (ADR 0018), so no other config is needed.
      FINCORE_AUTH_MODE: ${FINCORE_AUTH_MODE:-jwt}
      FINCORE_AUTH_ISSUER_URI: ${FINCORE_AUTH_ISSUER_URI:-http://localhost:58183}
      # Where this service fetches the signing keys — a name only the compose network resolves,
      # while the issuer above is the public string in every token.
      FINCORE_AUTH_JWKS_URI: ${FINCORE_AUTH_JWKS_URI:-http://identity:8083/.well-known/jwks.json}
      # Core's own credential for addressing the ledger in jwt mode (ADR 0014): a service token
      # minted for the `core` client. Unset in dev — header mode needs none.
      FINCORE_CORE_LEDGER_SERVICE_TOKEN: ${FINCORE_CORE_LEDGER_SERVICE_TOKEN:-}

      # The staff directory (admin-surface §5 over ADR 0018). Core mints its own short-lived
      # service token at need rather than carrying a long-lived one in configuration.
      FINCORE_CORE_IDENTITY_BASE_URL: http://identity:8083
      FINCORE_CORE_IDENTITY_CLIENT_ID: core
      FINCORE_CORE_IDENTITY_CLIENT_SECRET: ${FINCORE_CORE_IDENTITY_SECRET:-dev-core-directory-secret}
      SPRING_PROFILES_ACTIVE: ${FINCORE_CORE_PROFILE:-dev}
    ports:
      # Published on 58081 for the same reason the ledger uses 58080: Core's own tests bind 8081.
      - "${FINCORE_CORE_PORT:-58081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # The platform's first event consumer (ADR 0011). It moves no money: it reads
  # Core's business events and turns them into messages, so it is the last thing
  # to start and nothing waits on it.
  notification:
    build:
      # Root context: the Dockerfile builds through the Maven reactor, so it
      # needs the parent pom, the wrapper and both libs.
      context: .
      dockerfile: services/notification/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      # No hard dependency on a broker by name — the backbone is a choice (kafka | rabbit), and
      # naming one here would start it even when the other was chosen. A broker outage only delays
      # consumption; the consumer reconnects, and Kafka's retention (or the publisher's redelivery)
      # means events waiting during startup are not missed.
      # Every send asks Core two questions — which accounts a transaction moved
      # between, and who holds them. Waiting for readiness rather than start
      # means the first alert does not race Core's migrations. An unreachable
      # Core is not "no such customer": the consumer leaves the event
      # unconsumed and redelivery retries it.
      core:
        condition: service_healthy
      # Named explicitly rather than inherited through Core: this service now mints its own
      # credential before it can ask Core anything (ADR 0019), so identity is on its send path.
      identity:
        condition: service_healthy
    environment:
      # Its own database, never Core's (AGENTS.md rule 5). The roles come from
      # db/init/40-notification-roles.sql, which runs once on an empty volume.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification
      SPRING_DATASOURCE_USERNAME: fincore
      SPRING_DATASOURCE_PASSWORD: fincore
      # A container is not a dev machine; it must never start its own database
      # sidecar.
      SPRING_DOCKER_COMPOSE_ENABLED: "false"

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Never `earliest`. Kafka retains history for Compliance's benefit while
      # notifications care only about what is happening now (ADR 0005), so a
      # consumer starting at the beginning of a retained topic would send weeks
      # of stale alerts on its first start. The max-event-age guard below is the
      # second, independent line of defence — an offset is an operational detail
      # somebody eventually resets.
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: latest
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${FINCORE_NOTIFICATION_GROUP:-notification}
      # Core publishes under this prefix, so this is the topic its completed
      # transfers arrive on. One category, one publisher: the ledger's
      # posting.completed describes the same moment and is deliberately not
      # consumed here.
      FINCORE_NOTIFICATION_TOPICS: fincore.core.transfer.completed
      FINCORE_NOTIFICATION_MAX_EVENT_AGE_MS: ${FINCORE_NOTIFICATION_MAX_EVENT_AGE_MS:-900000}

      # The only outbound dependency on the send path. There is no ledger client
      # here and no gateway SDK.
      FINCORE_NOTIFICATION_CORE_BASE_URL: http://core:8081

      # Where this service mints its own credential for those reads (ADR 0019). It authenticates
      # as itself and asks for a token scoped to the tenant the event named — never asserting that
      # tenant on the call to Core, which is what keeps the tenant a claim rather than a caller's
      # word. The secret is the same dev throwaway the identity service registers above; a
      # deployment supplies a real one by reference (hard rule 8).
      FINCORE_NOTIFICATION_IDENTITY_BASE_URL: http://identity:8083
      FINCORE_NOTIFICATION_IDENTITY_CLIENT_ID: notification
      FINCORE_NOTIFICATION_IDENTITY_CLIENT_SECRET: ${FINCORE_NOTIFICATION_IDENTITY_SECRET:-dev-notification-reader-secret}
      # Seeds the development tenant at startup, loudly. Local stacks only.

      # Dev identity, as elsewhere in this file: headers rather than tokens, and
      # libs/auth refuses that unless a sanctioned profile is also active
      # (ADR 0010). The startup banner says loudly that this is not
      # authentication — and a second banner says the senders deliver nothing,
      # because the messaging connector does not exist yet.
      FINCORE_AUTH_MODE: ${FINCORE_AUTH_MODE:-jwt}
      # Defaults point at the identity service, so FINCORE_AUTH_MODE=jwt needs nothing more.
      FINCORE_AUTH_ISSUER_URI: ${FINCORE_AUTH_ISSUER_URI:-http://localhost:58183}
      FINCORE_AUTH_JWKS_URI: ${FINCORE_AUTH_JWKS_URI:-http://identity:8083/.well-known/jwks.json}
      SPRING_PROFILES_ACTIVE: ${FINCORE_NOTIFICATION_PROFILE:-dev}
    ports:
      # 58082 for the same reason the ledger uses 58080 and Core 58081: the
      # service's own tests bind 8082, and a stack must never be able to break
      # the build or the other way round.
      - "${FINCORE_NOTIFICATION_PORT:-58082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
