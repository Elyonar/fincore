# The edge (ADR 0014): configuration, not a service.
#
# One origin for the client apps. It terminates TLS in real deployments (dev listens on 80),
# routes by path prefix, and passes the bearer token through untouched. It authenticates
# nothing and authorizes nothing — token validation happens in every service via libs/auth, so
# a misconfigured proxy fails closed, not open.
#
# There is deliberately NO route to the ledger. Clients never address the ledger; the reads
# they need are Core endpoints (statements, balances — the proxy decision in ui-runway.md §2).
#
# The identity service (ADR 0018) enters through this same origin under /api/identity/, because
# authentication is client-driven: the client POSTs credentials to this platform, there is no
# redirect to a separate provider. Only the authentication surface is exposed here; the
# service-facing directory API is not routed — tenants never reach it.

worker_processes 1;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    sendfile on;

    # CORS allowlist (dev). The only origin the browser client is served from — the manifest's
    # webOrigin for this institution. Reflecting $http_origin verbatim was the H3 finding in the
    # identity security review: with Authorization in the allowed headers it hands any site the
    # right to ride a user's session. Empty when the origin is not allowlisted, and nginx drops
    # an add_header whose value is empty, so unknown origins simply get no CORS grant.
    map $http_origin $fincore_cors_origin {
        default                     "";
        "http://localhost:3000"     $http_origin;
        "http://127.0.0.1:3000"     $http_origin;
        "https://app.stardevs.xyz"  $http_origin;
    }

    # Money-path requests are small; refuse anything that is not.
    client_max_body_size 256k;

    # Docker's embedded resolver. Without this, nginx resolves each upstream once at startup and
    # caches the address for the life of the process: rebuild a service and every request 502s
    # until someone restarts the edge. Re-resolving on a short TTL is what makes `docker compose
    # up -d --build core` a non-event for the proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Upstreams held in variables, which is what forces nginx to resolve at request time
        # rather than at startup. Each location rewrites the /api/<service> prefix away first,
        # because proxy_pass with a variable passes the URI through untouched.
        set $core_upstream      http://core:8081;
        set $identity_upstream  http://identity:8083;

        # --- The API: one prefix, one upstream -------------------------------
        # /api/core/v1/... -> core /v1/...  The bearer token passes through as-is.
        location /api/core/ {
            # Before the rewrite: `break` ends rewrite-phase processing, and the CORS
            # preflight below is a rewrite-phase `if`. Ordered the other way round, a
            # preflight is proxied to a service that has no bearer to check and answers
            # 401 — which the browser reports as a CORS failure, naming the wrong cause.
            if ($request_method = OPTIONS) { return 204; }
            rewrite ^/api/core(/.*)$ $1 break;
            proxy_pass $core_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Development CORS for a Vite dev server on its own origin. In deployments the SPA
            # is served from this origin and none of this is needed; scope it via env if the
            # dev origin differs.
            add_header Access-Control-Allow-Origin $fincore_cors_origin always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Max-Age 600 always;
        }

        # --- The auth API: client-driven login, refresh, MFA, etc. -----------
        # /api/identity/v1/... -> identity /v1/...  and the JWKS/discovery paths. Bearer passes
        # through untouched. The directory admin API (/v1/directory/**) is deliberately not
        # matched here — it is service-facing and never reaches the edge.
        # An allowlist, not a denylist. Naming the two public prefixes and refusing the rest
        # means a path added to identity tomorrow — the directory, policy, audit — is unreachable
        # from the internet by default rather than by remembering to exclude it. The previous
        # shape proxied everything and subtracted one prefix, which is the arrangement where a
        # new admin endpoint quietly becomes public the day it is written.
        location /api/identity/v1/auth/ {
            # Before the rewrite: `break` ends rewrite-phase processing, and the CORS
            # preflight below is a rewrite-phase `if`. Ordered the other way round, a
            # preflight is proxied to a service that has no bearer to check and answers
            # 401 — which the browser reports as a CORS failure, naming the wrong cause.
            if ($request_method = OPTIONS) { return 204; }
            rewrite ^/api/identity(/.*)$ $1 break;
            proxy_pass $identity_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin $fincore_cors_origin always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Max-Age 600 always;
        }

        # JWKS and discovery: public by definition — a verifier that cannot fetch the keys
        # cannot verify anything.
        location /api/identity/.well-known/ {
            # Before the rewrite: `break` ends rewrite-phase processing, and the CORS
            # preflight below is a rewrite-phase `if`. Ordered the other way round, a
            # preflight is proxied to a service that has no bearer to check and answers
            # 401 — which the browser reports as a CORS failure, naming the wrong cause.
            if ($request_method = OPTIONS) { return 204; }
            rewrite ^/api/identity(/.*)$ $1 break;
            proxy_pass $identity_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin $fincore_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        }

        # Self-service: the signed-in person's own record. Browser-facing and authenticated by
        # their own token, like the MFA endpoints — a teller reading their own phone number is not
        # an administrative act and must not need an administrative permission.
        location /api/identity/v1/me {
            if ($request_method = OPTIONS) { return 204; }
            rewrite ^/api/identity(/.*)$ $1 break;
            proxy_pass $identity_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin $fincore_cors_origin always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Methods "GET, PUT, OPTIONS" always;
            add_header Access-Control-Max-Age 600 always;
        }

        # Everything else on the identity service — the directory above all — is service-facing.
        location /api/identity/ { return 404; }

        # --- The SPA ---------------------------------------------------------
        # Built client assets mount here; until a client exists, this answers with a plain
        # placeholder rather than a 404, so "the edge is up" is checkable.
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html =404;
        }
    }
}
