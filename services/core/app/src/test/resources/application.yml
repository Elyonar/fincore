# Tests run against real PostgreSQL — never an in-memory substitute. The trigger,
# constraint and row-level-security behaviour under test is PostgreSQL's.
#
# NOTE: this file *replaces* src/main/resources/application.yml rather than overlaying it —
# test-classes come first on the classpath and Boot loads one application.yml. Anything the tests
# need to behave like production has to be repeated here. That has already caused two silent
# failures (the ledger base URL, then Swagger's path 404ing), so treat a setting's absence here as
# a bug rather than a default.
spring:
  profiles:
    active: test
  datasource:
    hikari:
      maximum-pool-size: 1
      minimum-idle: 0
      idle-timeout: 10000
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/core_test}
    username: ${SPRING_DATASOURCE_USERNAME:fincore}
    password: ${SPRING_DATASOURCE_PASSWORD:fincore}

# Swagger at /docs, matching main. Repeated here because of the shadowing noted above.
springdoc:
  swagger-ui:
    path: /docs

fincore:
  core:
    datasource:
      customer:
        maximum-pool-size: 1
        minimum-idle: 0
        idle-timeout: 10000
        jdbc-url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/core_test}
        username: core_customer
        password: core_customer
      product:
        maximum-pool-size: 1
        minimum-idle: 0
        idle-timeout: 10000
        jdbc-url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/core_test}
        username: core_product
        password: core_product
      relay:
        maximum-pool-size: 1
        minimum-idle: 0
        idle-timeout: 10000
        jdbc-url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/core_test}
        username: core_relay
        password: core_relay
      worker:
        maximum-pool-size: 1
        minimum-idle: 0
        idle-timeout: 10000
        jdbc-url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/core_test}
        username: core_worker
        password: core_worker
      organization:
        maximum-pool-size: 1
        minimum-idle: 0
        idle-timeout: 10000
        jdbc-url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/core_test}
        username: core_organization
        password: core_organization
      orchestration:
        maximum-pool-size: 1
        minimum-idle: 0
        idle-timeout: 10000
        jdbc-url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/core_test}
        username: core_orchestration
        password: core_orchestration
  auth:
    # Verifies nothing — and only starts at all because the `test` profile is
    # sanctioned, which exercises the guard rather than bypassing it.
    mode: dev

management:
  health:
    rabbit:
      enabled: false
    kafka:
      enabled: false
