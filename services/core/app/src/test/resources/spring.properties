# How many Spring application contexts the test suite keeps alive at once.
#
# Core holds six datasources per context — one per module role, plus the owner, the relay and the
# worker (ADR 0006, ADR 0007) — and the default cache of 32 contexts therefore pins several hundred
# PostgreSQL connections. Measured: 237 at peak, against a server whose default limit is 100.
#
# Locally that was invisible: compose.yaml starts PostgreSQL with max_connections=400, so the suite
# fit. CI's service container takes the default, and the whole Core step failed with "sorry, too
# many clients already" — a divergence between the developer's database and CI's, which is the
# class of problem services/core/docs/CHANGELOG.md v1.9 already had to fix once.
#
# Measured on this suite: 237 connections at the default, 87 at four contexts, 56 at two — against
# a stack already holding 27 idle. Two keeps the suite fast (context reuse still works within a
# class and between adjacent ones) while leaving CI's 100 a margin it can lose a race against.
spring.test.context.cache.maxSize=2
