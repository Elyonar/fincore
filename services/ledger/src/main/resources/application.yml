spring:
  application:
    name: ledger

server:
  port: ${LEDGER_PORT:8080}

spring.datasource.hikari:
  # Probe idle connections so a failover or an admin cull is noticed before a
  # posting borrows a dead one. Hikari skips validation for connections used in
  # the last 500ms, so this narrows the window rather than closing it — the
  # retry rule closes the rest.
  keepalive-time: 30000
  validation-timeout: 3000
  max-lifetime: 900000

springdoc:
  swagger-ui:
    # /docs is the path people guess and remember. springdoc's own
    # /swagger-ui/index.html keeps working, because tooling expects it.
    path: /docs
    # Endpoints in the order this service's own documentation introduces them,
    # rather than alphabetically.
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  api-docs:
    # "v3" is the OpenAPI *specification* version, not this API's version — the
    # API is /v1. Naming the file plainly avoids implying otherwise.
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        # Deliberately narrow. The ledger's operational surface grows by
        # decision, not by default — an actuator that exposes env, beans or
        # heapdump on an internal network is a disclosure waiting to happen.
        # prometheus is included because the outbox staleness alert has to be
        # scrapeable; a log line alerts only whoever is grepping.
        include: health,info,prometheus
  endpoint:
    health:
      # Readiness and liveness are what an orchestrator restarts or routes on;
      # a single aggregate "UP" cannot distinguish "starting" from "serving".
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: ledger
    description: Double-entry posting engine — the single source of monetary truth
