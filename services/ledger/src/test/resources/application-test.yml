# Test profile.
#
# The database is supplied, not started by the tests: `docker compose up -d postgres`
# locally, or the CI service container. CI injects SPRING_DATASOURCE_* and so wins
# over these defaults.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/ledger}
    username: ${SPRING_DATASOURCE_USERNAME:fincore}
    password: ${SPRING_DATASOURCE_PASSWORD:fincore}
  flyway:
    enabled: true
  docker-compose:
    enabled: false   # the suite does not manage its own infrastructure

logging:
  level:
    org.flywaydb: INFO
